name: caller
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - name: decode
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-lab")
          echo "$TOKEN" | jq -r .value | python3 -c "import sys,base64,json; t=sys.stdin.read().strip().split('.')[1]; t+='='*(-len(t)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1,sort_keys=True))"
  envcolon:
    runs-on: ubuntu-latest
    environment: "weird:env"
    steps:
      - name: decode
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-lab")
          echo "$TOKEN" | jq -r .value | python3 -c "import sys,base64,json; t=sys.stdin.read().strip().split('.')[1]; t+='='*(-len(t)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1,sort_keys=True))"
  envslash:
    runs-on: ubuntu-latest
    environment: "refs/heads/main"
    steps:
      - name: decode
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-lab")
          echo "$TOKEN" | jq -r .value | python3 -c "import sys,base64,json; t=sys.stdin.read().strip().split('.')[1]; t+='='*(-len(t)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1,sort_keys=True))"
  envspace:
    runs-on: ubuntu-latest
    environment: "a b"
    steps:
      - name: decode
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-lab")
          echo "$TOKEN" | jq -r .value | python3 -c "import sys,base64,json; t=sys.stdin.read().strip().split('.')[1]; t+='='*(-len(t)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1,sort_keys=True))"
